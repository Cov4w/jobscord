<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SignalR 채팅</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Malgun Gothic", sans-serif;
      margin: 0; background: #f0f2f5;
      display: flex; justify-content: center;
    }
    .chat {
      width: 100%; max-width: 480px; height: 100vh;
      display: flex; flex-direction: column; background: #fff;
    }

    /* 상단 헤더: 연결 상태 표시 */
    .header {
      padding: 12px 16px; background: #3b5bdb; color: #fff;
      display: flex; justify-content: space-between; align-items: center;
    }
    .status { font-size: 12px; opacity: .9; }

    /* 메시지가 쌓이는 영역: 넘치면 스크롤 */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      background: #e9edf5;
    }

    /* 메시지 한 줄 (이름 + 말풍선 + 시간) */
    .msg { display: flex; flex-direction: column; max-width: 75%; }
    .msg .name { font-size: 12px; color: #555; margin-bottom: 2px; }
    .msg .bubble {
      padding: 8px 12px; border-radius: 14px;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg .time { font-size: 11px; color: #888; margin-top: 2px; }

    /* 상대 메시지: 왼쪽 정렬, 흰색 말풍선 */
    .msg.other { align-self: flex-start; }
    .msg.other .bubble { background: #fff; color: #222; border-top-left-radius: 4px; }

    /* 내 메시지: 오른쪽 정렬, 파란 말풍선 */
    .msg.me { align-self: flex-end; align-items: flex-end; }
    .msg.me .bubble { background: #3b5bdb; color: #fff; border-top-right-radius: 4px; }

    /* 시스템 안내(연결됨, 재연결 중 등): 가운데 정렬 */
    .system {
      align-self: center; font-size: 12px; color: #666;
      background: rgba(0,0,0,.06); padding: 3px 10px; border-radius: 10px;
    }

    /* 하단 입력 영역 */
    .input-area { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ddd; }
    .input-area input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    #user { width: 90px; }
    #msg  { flex: 1; }
    #send {
      padding: 0 16px; border: 0; border-radius: 8px;
      background: #3b5bdb; color: #fff; cursor: pointer;
    }
    #send:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">
      <strong>SignalR 채팅</strong>
      <span class="status">
        서버 시간 <span id="clock">--:--:--</span> · <span id="status">연결 중...</span>
      </span>
    </div>

    <!-- 받은 메시지와 내가 보낸 메시지가 모두 여기에 표시된다 -->
    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input id="user" placeholder="이름" maxlength="20" />
      <input id="msg" placeholder="메시지를 입력하세요" autocomplete="off" />
      <button id="send" disabled>전송</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const statusEl   = document.getElementById("status");
    const userEl     = document.getElementById("user");
    const msgEl      = document.getElementById("msg");
    const sendBtn    = document.getElementById("send");

    // 이름 기본값 (비워 두면 전송 시 "익명"으로 처리)
    userEl.value = "손님" + Math.floor(Math.random() * 900 + 100);

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/chatHub")
      .withAutomaticReconnect()
      .build();

    // 메시지 영역을 맨 아래로 스크롤
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 시스템 안내 문구 추가
    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "system";
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    // 말풍선 추가. isMe 값에 따라 왼쪽/오른쪽 스타일이 결정된다.
    function addMessage({ user, message, time, isMe }) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (isMe ? "me" : "other");

      // 상대 메시지에만 이름 표시
      if (!isMe) {
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = user;          // textContent: XSS 방지
        wrap.appendChild(name);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message;       // 절대 innerHTML을 쓰지 않는다
      wrap.appendChild(bubble);

      const t = document.createElement("div");
      t.className = "time";
      t.textContent = time;
      wrap.appendChild(t);

      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    // 서버가 보낸 메시지 수신 (start() 전에 등록)
    connection.on("ReceiveMessage", (user, message, senderId, time) => {
      addMessage({
        user, message, time,
        // 보낸 사람의 ConnectionId가 내 ConnectionId와 같으면 내 메시지
        isMe: senderId === connection.connectionId
      });
    });
    // 서버의 ClockWorker가 1초마다 호출하는 핸들러
    connection.on("Tick", (time) => {
      document.getElementById("clock").textContent = time;
    });

    // (4번 REST 푸시 테스트를 할 경우) /api/orders/{id}/complete 호출 시 도착
    connection.on("OrderCompleted", (id) => {
      addSystem(`주문 #${id} 처리 완료`);
    });
    // 연결 상태 표시와 전송 버튼 활성/비활성
    function setConnected(ok, text) {
      statusEl.textContent = text;
      sendBtn.disabled = !ok;
    }

    connection.onreconnecting(() => {
      setConnected(false, "재연결 중...");
      addSystem("연결이 끊겨 다시 연결하는 중입니다.");
    });
    connection.onreconnected(() => {
      setConnected(true, "연결됨");
      addSystem("다시 연결되었습니다. (끊긴 동안의 메시지는 받지 못합니다)");
    });
    connection.onclose(() => {
      setConnected(false, "연결 종료");
      addSystem("연결이 종료되었습니다. 페이지를 새로고침해 주세요.");
    });

    // 전송 처리
    async function send() {
      const user = userEl.value.trim() || "익명";
      const message = msgEl.value.trim();
      if (!message) return;

      try {
        await connection.invoke("SendMessage", user, message);
        msgEl.value = "";     // 성공했을 때만 입력창 비움
        msgEl.focus();
      } catch (err) {
        addSystem("전송 실패: " + err);
      }
    }

    sendBtn.onclick = send;
    msgEl.addEventListener("keydown", e => {
      // 한글 조합 중 Enter는 무시. 안 하면 마지막 글자가 중복 전송되는 문제가 생긴다.
      if (e.key === "Enter" && !e.isComposing) send();
    });

    // 연결 시작
    connection.start()
      .then(() => {
        setConnected(true, "연결됨");
        addSystem("채팅에 연결되었습니다.");
      })
      .catch(err => {
        setConnected(false, "연결 실패");
        addSystem("연결 실패: " + err);
      });
  </script>
</body>
</html>
